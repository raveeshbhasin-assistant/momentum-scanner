# Ignition Watch — the scan of record.
#
# Runs ignition/scan.py every weekday after the US close and commits the
# output (latest.json, runs.jsonl, history/<date>.json) to the `ignition-data`
# branch. Git keeps every run forever; Railway's disk is wiped on redeploy.
# Pushing to `ignition-data` (not main) means no Railway redeploy. themes_web
# reads the branch through themes_web/scheduler.refresh_ignition(). The last
# step (ignition/notify.py) emails any new FIRE/REFIRE to the recipients.
name: ignition daily scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 17:30 EDT / 16:30 EST — after the close either way
    # GitHub starts cron jobs 3-4 hours late, and at ~21:00 ET Yahoo often has the
    # day's bar for under half the universe, so the evening run frequently scores
    # the previous session. A second run before the open picks up what it missed.
    # scan.py drops today's live bar if this one ever drifts past 09:30 ET.
    - cron: "0 7 * * 1-5"     # 03:00 EDT / 02:00 EST — before the open, after Yahoo settles
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a [TEST] mail built from the most recent fires (checks the key, sender and recipients)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:                    # code and universe only; doc edits don't need a scan
      - "ignition/scan.py"
      - "ignition/notify.py"
      - "ignition/universe.txt"
      - ".github/workflows/ignition-daily.yml"

permissions:
  contents: write

concurrency:
  group: ignition-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install "yfinance>=0.2.43" "pandas>=2.2.0" "numpy>=1.26.0"

      - name: Check out the data branch (create it on first run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin ignition-data >/dev/null; then
            git fetch --depth 1 origin ignition-data
            git worktree add ../data FETCH_HEAD
            git -C ../data checkout -B ignition-data
          else
            git worktree add --detach ../data
            git -C ../data checkout --orphan ignition-data
            git -C ../data rm -rfq .
          fi
          mkdir -p ignition/data
          if [ -d ../data/ignition/data ]; then cp -r ../data/ignition/data/. ignition/data/; fi

      - name: Scan
        run: python ignition/scan.py

      - name: Commit the run to ignition-data
        run: |
          mkdir -p ../data/ignition/data
          cp -r ignition/data/. ../data/ignition/data/
          cd ../data
          git add -A
          ASOF=$(python -c "import json;print(json.load(open('ignition/data/latest.json'))['asof'])")
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -qm "ignition: scan asof ${ASOF} ($(date -u +%FT%H:%MZ))"
            git push origin ignition-data
          fi

      # After the commit, so a run that fails to publish never mails. scan.py marks
      # as new only the events after the previous run's data date, so a same-day
      # re-run mails nothing and nothing is mailed twice. Without the secret the
      # step only prints what it would have sent. Resend's sandbox sender can only
      # reach the account owner; set IGNITION_NOTIFY_FROM (repo variable) to an
      # address on a domain verified in Resend to reach every recipient.
      - name: Email new fires and re-fires
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          IGNITION_NOTIFY_FROM: ${{ vars.IGNITION_NOTIFY_FROM }}
          IGNITION_NOTIFY_EMAIL: ${{ vars.IGNITION_NOTIFY_EMAIL }}
          IGNITION_NOTIFY_TEST: ${{ inputs.test_email && '1' || '' }}
        run: python ignition/notify.py
