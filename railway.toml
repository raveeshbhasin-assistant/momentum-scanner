# Repo-shared build config. Applies to BOTH Railway services (momentum-scanner + themes_web).
# Builder ONLY — never put startCommand here (would clobber the other service's start).
# Each service keeps its own start: momentum-scanner = Procfile 'python app.py';
# themes_web = dashboard 'uvicorn themes_web.app:app'.
# NIXPACKS forced so builds avoid Railpack/mise (which broke 2026-06 on GitHub python attestations).
# No nixpacks.toml on purpose: Nixpacks auto-detects requirements.txt and provisions python+pip
# correctly itself. A custom nixpacks.toml with nixPkgs=['python311'] lacks pip (ensurepip/pip both
# missing on the Nix CPython) and caused repeated 'pip/No module named pip' build failures.
[build]
builder = "NIXPACKS"
